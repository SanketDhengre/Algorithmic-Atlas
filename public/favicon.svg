<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Slate background circle -->
  <circle cx="16" cy="16" r="15" fill="#0a0e1a"/>
  <!-- Outer golden compass ring -->
  <circle cx="16" cy="16" r="13.5" fill="none" stroke="#f5c842" stroke-width="1.5"/>
  <!-- Subtly drawn coordinates grid -->
  <line x1="16" y1="2.5" x2="16" y2="29.5" stroke="rgba(245, 200, 66, 0.2)" stroke-width="0.5" stroke-dasharray="1.5 1.5"/>
  <line x1="2.5" y1="16" x2="29.5" y2="16" stroke="rgba(245, 200, 66, 0.2)" stroke-width="0.5" stroke-dasharray="1.5 1.5"/>
  <!-- Stylized 'A' forming an algorithmic graph / mountain path -->
  <path d="M16 7.5 L8.5 22.5 L23.5 22.5 Z" fill="none" stroke="#e2e8f0" stroke-width="1.5" stroke-linejoin="round"/>
  <path d="M12.25 15.5 L19.75 15.5" fill="none" stroke="#e2e8f0" stroke-width="1.5"/>
  <!-- Graph vertices (Nodes) -->
  <circle cx="16" cy="7.5" r="2.25" fill="#f5c842" stroke="#0a0e1a" stroke-width="0.75"/>
  <circle cx="8.5" cy="22.5" r="1.75" fill="#e2e8f0" stroke="#0a0e1a" stroke-width="0.5"/>
  <circle cx="23.5" cy="22.5" r="1.75" fill="#e2e8f0" stroke="#0a0e1a" stroke-width="0.5"/>
  <!-- Compass ticks -->
  <line x1="16" y1="2.5" x2="16" y2="4.5" stroke="#f5c842" stroke-width="1"/>
  <line x1="16" y1="27.5" x2="16" y2="29.5" stroke="#f5c842" stroke-width="1"/>
  <line x1="2.5" y1="16" x2="4.5" y2="16" stroke="#f5c842" stroke-width="1"/>
  <line x1="27.5" y1="16" x2="29.5" y2="16" stroke="#f5c842" stroke-width="1"/>
</svg>
